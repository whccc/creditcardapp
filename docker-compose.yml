name: creditcardapp

services:
  core-api:
    build: ./backend-whc-prueba-ty
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-demo-signing-key-change-me-0123456789}
      DemoData__Enabled: ${DEMO_DATA_ENABLED:-true}
      DemoData__Email: "demo@creditcard.app"
      DemoData__Password: "Demo1234!"
      DemoData__FullName: "Usuario Demo"
    volumes:
      - core-data:/app/App_Data
    networks:
      - backend
    restart: unless-stopped

  bff:
    build: ./bff-whc-prueba-ty
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      CoreApi__AuthenticationBaseUrl: "http://core-api:8080"
      CoreApi__CardsBaseUrl: "http://core-api:8080"
      CoreApi__PaymentsBaseUrl: "http://core-api:8080"
    volumes:
      - bff-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      - core-api
    networks:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend-whc-prueba-ty
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - bff
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  core-data:
  bff-keys:
